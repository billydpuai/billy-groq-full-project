kind = "web"
previewPath = "/"
title = "DePaul University Demo Groq"
version = "1.0.0"
id = "artifacts/depaul-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23882

[services.development]
run = "pnpm --filter @workspace/depaul-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/depaul-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/depaul-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23882"
BASE_PATH = "/"
